name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout matrix-visualiser source
        uses: actions/checkout@v4
        with:
          repository: fullwoodenshovel/matrix-visualiser
          path: matrix-visualiser-src

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Copy site files
        run: |
          mkdir -p dist/matrix
          cp index.html dist/
          cp CNAME dist/
          cp matrix/index.html dist/matrix/
          touch dist/.nojekyll

      - name: Build WASM targets from layout.json
        run: |
          jq -c '.[]' layout.json | while read -r entry; do
            pathname=$(echo "$entry" | jq -r '.pathname')
            filename=$(echo "$entry" | jq -r '.filename')
            features=$(echo "$entry" | jq -r '[.features[]] | join(",")')

            mkdir -p "$GITHUB_WORKSPACE/dist/$pathname"

            if [ -n "$features" ]; then
              cargo build \
                --manifest-path "$GITHUB_WORKSPACE/matrix-visualiser-src/Cargo.toml" \
                --target wasm32-unknown-unknown \
                --release \
                --features "$features"
            else
              cargo build \
                --manifest-path "$GITHUB_WORKSPACE/matrix-visualiser-src/Cargo.toml" \
                --target wasm32-unknown-unknown \
                --release
            fi

            cp "$GITHUB_WORKSPACE/matrix-visualiser-src/target/wasm32-unknown-unknown/release/matrix-visualiser.wasm" \
               "$GITHUB_WORKSPACE/dist/$pathname/$filename"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check dist contents
        run: find dist -type f