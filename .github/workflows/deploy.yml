# layout.json can be understood from the examples already in it and the following information:
# If "features" key is present, it compiles the code for WASM and takes the file compiled
# If "features" key is not present, it takes the file directly from the source code.

name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Copy index into dist
        run: |
          mkdir -p dist
          cp -r index/. dist/
          touch dist/.nojekyll

      - name: Build and copy targets from layout.json
        run: |
          jq -c '.[]' layout.json | while read -r entry; do
            source=$(echo "$entry"   | jq -r '.source')
            pathname=$(echo "$entry" | jq -r '.pathname')

            mkdir -p "$GITHUB_WORKSPACE/dist/$(dirname "$pathname")"

            if echo "$entry" | jq -e 'has("features")' > /dev/null; then
              # WASM build — source is owner/repo
              features=$(echo "$entry" | jq -r '[.features[]] | join(",")')
              srcdir="$GITHUB_WORKSPACE/sources/$source"

              if [ ! -d "$srcdir" ]; then
                mkdir -p "$(dirname "$srcdir")"
                git clone "https://github.com/$source" "$srcdir"
              fi

              if [ -n "$features" ]; then
                cargo build \
                  --manifest-path "$srcdir/Cargo.toml" \
                  --target wasm32-unknown-unknown \
                  --release \
                  --features "$features"
              else
                cargo build \
                  --manifest-path "$srcdir/Cargo.toml" \
                  --target wasm32-unknown-unknown \
                  --release
              fi

              pkgname=$(cargo metadata \
                --manifest-path "$srcdir/Cargo.toml" \
                --no-deps --format-version 1 \
                | jq -r '.packages[0].name')

              cp "$srcdir/target/wasm32-unknown-unknown/release/${pkgname}.wasm" \
                 "$GITHUB_WORKSPACE/dist/$pathname"

            else
              # File copy — source is owner/repo/path/to/file
              repopath=$(echo "$source" | cut -d'/' -f1-2)
              filepath=$(echo "$source" | cut -d'/' -f3-)
              srcdir="$GITHUB_WORKSPACE/sources/$repopath"

              if [ ! -d "$srcdir" ]; then
                mkdir -p "$(dirname "$srcdir")"
                git clone "https://github.com/$repopath" "$srcdir"
              fi

              cp "$srcdir/$filepath" "$GITHUB_WORKSPACE/dist/$pathname"
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check dist contents
        run: find dist -type f